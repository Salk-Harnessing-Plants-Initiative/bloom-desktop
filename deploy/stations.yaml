# Deployment stations for Bloom Desktop.
#
# This file is PUBLIC. Never add IP addresses, hostnames, or credentials.
# CI rejects unknown keys, credential-like field names, and any value with an
# IPv4/IPv6 address or a URL containing a password, but it can't catch
# everything (hostnames, YAML comments), so keep private details out entirely.
# Station-specific settings (camera IP, Bloom credentials, mock-mode
# variables) live on the station, not here.
#
# Fields (all required):
#   name                unique id, lowercase letters/digits/dashes
#   type                cylinderscan | graviscan
#   os                  windows (cylinderscan) | linux (graviscan)
#   location            room or bench
#   bloom_scanner_name  scanner name as registered in Bloom
#   environment         GitHub environment used for deployments
#   runner_label        label of the station's self-hosted runner
#   active              false to keep a retired station listed but skipped
#
# See docs/RELEASING.md for how to add a station.

stations:
  - name: pc1
    type: cylinderscan
    os: windows
    location: WIF room 104/105
    bloom_scanner_name: FastScanner
    environment: station-pc1
    runner_label: station-pc1
    active: true
