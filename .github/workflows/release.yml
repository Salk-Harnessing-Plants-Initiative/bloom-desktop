name: Release

# Builds a release on demand: Actions → Release → Run workflow, from main,
# with the version to release (must equal package.json).
#   verify → build-python → build-windows / build-linux → manifest → publish
# Only after every build passes, `publish` creates a DRAFT GitHub Release
# with the installers, pinned to the commit that was built. No tag exists
# yet: a maintainer reviews the draft and clicks Publish, and GitHub then
# creates the vX.Y.Z tag at that commit. `publish` is the only job that can
# write, and it runs no build code. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal package.json on main (e.g. 0.2.0)'
        required: true
        type: string

permissions: {}

# One release at a time; never cancel a release part-way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check the workflow was started from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are only made from main (this run was started from $GITHUB_REF). Choose main in \"Run workflow\"."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Check version matches package.json
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: npx ts-node scripts/release/release-version.ts "$VERSION" --github-output

      - name: Check "All Checks Passed" succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Uses the newest "All Checks Passed" run (highest id) from GitHub
        # Actions (app_id 15368), so a later failed re-run isn't masked by an older
        # success and other apps can't post a run with the same name.
        run: |
          latest=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=All%20Checks%20Passed&app_id=15368&per_page=100" \
            --jq '.check_runs | sort_by(.id) | last | if . == null then "none" else "\(.status) \(.conclusion)" end')
          if [[ "$latest" == "none" ]]; then
            echo "::error::No \"All Checks Passed\" run found on $GITHUB_SHA. Wait for CI on main, then run this workflow again."
            exit 1
          fi
          if [[ "$latest" != completed* ]]; then
            echo "::error::CI is still running on $GITHUB_SHA ($latest). Re-run this workflow once \"All Checks Passed\" finishes."
            exit 1
          fi
          if [[ "$latest" != "completed success" ]]; then
            echo "::error::\"All Checks Passed\" did not succeed on $GITHUB_SHA ($latest)"
            exit 1
          fi

      - name: Check this version isn't released or tagged yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released; releases are never overwritten. Bump package.json for a new version."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump package.json for a new version."
            exit 1
          fi

  build-python:
    needs: verify
    name: Build - Python Executable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build Python executable
        run: |
          uv sync --extra dev --frozen
          uv run pyinstaller python/main.spec

      - name: Upload Python executable
        uses: actions/upload-artifact@v4
        with:
          name: python-executable-${{ runner.os }}
          path: dist/
          retention-days: 3

  # Release builds deliberately skip dependency caches so every release is
  # built from a clean `npm ci`.
  build-windows:
    needs: build-python
    name: Build - Windows installer (CylinderScan)
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Download Python executable
        uses: actions/download-artifact@v4
        with:
          name: python-executable-${{ runner.os }}
          path: dist/

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          BLOOM_DATABASE_URL: 'file:./dev.db'

      - name: Make application (maker stage)
        run: npm run make

      - name: Verify maker artifacts were produced
        run: npm run test:make:artifacts

      - name: Upload Windows build output
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/make/**
          retention-days: 3

  build-linux:
    needs: build-python
    name: Build - Linux package (GraviScan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Download Python executable
        uses: actions/download-artifact@v4
        with:
          name: python-executable-${{ runner.os }}
          path: dist/

      - name: Make executable
        run: chmod +x dist/bloom-hardware

      - name: Install system dependencies for native build + deb maker
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libusb-1.0-0-dev pkg-config fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          BLOOM_DATABASE_URL: 'file:./dev.db'

      - name: Make application (maker stage, deb only)
        run: npm run make:linux

      - name: Verify maker artifacts were produced
        run: npm run test:make:artifacts

      - name: Upload Linux build output
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/make/**
          retention-days: 3

  manifest:
    needs: [verify, build-windows, build-linux]
    name: Build release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Download Windows build output
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: build/windows

      - name: Download Linux build output
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: build/linux

      - name: Write manifest.json and SHA256SUMS
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          npx ts-node scripts/release/release-manifest.ts \
            --tag "$TAG" --version "$VERSION" --commit "$GITHUB_SHA" \
            --windows-dir build/windows --linux-dir build/linux \
            --out-dir release-bundle

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-bundle/
          retention-days: 3

  publish:
    needs: [verify, manifest]
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle

      - name: Verify checksums
        working-directory: release-bundle
        run: sha256sum -c SHA256SUMS

      # Drafts are only visible with write access, so verify can't see them;
      # check here so a re-run doesn't leave two drafts for one version.
      - name: Check no draft exists for this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .html_url")
          if [[ -n "$existing" ]]; then
            echo "::error::A release or draft for $TAG already exists: $existing. If it's a draft, publish it only if it has all the files listed in its SHA256SUMS plus manifest.json; otherwise delete it and run this workflow again."
            exit 1
          fi

      # --draft creates no tag. Publishing the draft (a maintainer, on the
      # Releases page) creates the tag at --target, the commit that was built.
      # gh doesn't remove an explicit --draft when an upload fails, so this
      # step checks the draft holds exactly the bundle's files and deletes it
      # otherwise: a draft only ever exists complete, and "Re-run failed jobs"
      # can try again with the same bundle.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          failed=""
          gh release create "$TAG" release-bundle/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Bloom Desktop $TAG" \
            --generate-notes \
            --prerelease="$PRERELEASE" || failed="the upload failed"
          # A just-created draft can take a moment to appear in the list, and
          # the call itself can fail, so look it up a few times.
          release_id=""
          for attempt in 1 2 3; do
            release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" || true)
            [[ -n "$release_id" ]] && break
            [[ "$attempt" -lt 3 ]] && sleep 5
          done
          if [[ -z "$failed" && -z "$release_id" ]]; then
            failed="the draft wasn't found after creating it"
          fi
          if [[ -z "$failed" ]]; then
            if ! attached=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name'); then
              failed="the draft's files couldn't be listed"
            elif [[ "$(sort <<< "$attached")" != "$(ls release-bundle | sort)" ]]; then
              failed="the draft doesn't have exactly the bundle's files (attached: $(echo $attached))"
            fi
          fi
          if [[ -z "$failed" ]]; then
            echo "Draft $TAG created with every file. Review it on the Releases page, then publish."
            exit 0
          fi
          echo "::error::Creating the draft for $TAG failed: $failed."
          if [[ -z "$release_id" ]]; then
            echo "::error::Couldn't find the draft for $TAG to delete it. If a draft for $TAG is on the Releases page, delete it, then use \"Re-run failed jobs\"."
          elif gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"; then
            echo "::error::Deleted the incomplete draft for $TAG. Use \"Re-run failed jobs\" to try again."
          else
            echo "::error::Couldn't delete the incomplete draft for $TAG. Delete it on the Releases page, then use \"Re-run failed jobs\"."
          fi
          exit 1
