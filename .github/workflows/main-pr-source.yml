name: Main PR Source

# PRs into main must come from this repo's development branch. Required by
# the main ruleset; maintainers with ruleset bypass can merge hotfix PRs
# from other branches.
on:
  pull_request:
    branches:
      - main
    # 'edited' re-runs the check when a PR's base branch is changed to main.
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  main-pr-source:
    name: Main PR Source
    runs-on: ubuntu-latest
    steps:
      - name: Require development as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "development" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "Source branch is development."
            exit 0
          fi
          echo "::error::PRs into main must come from development in $BASE_REPO (got $HEAD_REPO:$HEAD_REF). Hotfixes need a maintainer to bypass this check."
          exit 1
